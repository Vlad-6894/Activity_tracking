services:
  fitnes_postgres:
    image: postgres:18.6-bookworm
    container_name: fitnes-env-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: fitnes-env-postgres-port-forwarder
    restart: unless-stopped
    depends_on:
      fitnes_postgres:
        condition: service_healthy
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:fitnes_postgres:5432
    ports:
      - "127.0.0.1:5433:5432"

  fitnes-postgres-migrate:
    image: migrate/migrate:v4.19.1
    container_name: fitnes-env-postgres-migrate
    depends_on:
      fitnes_postgres:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fitnes_postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up

  ngrok:
    image: ngrok/ngrok:3
    container_name: fitnes-env-ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --url=${NGROK_DOMAIN} host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
