name: activity-tracking

services:
  activity-tracking-postgres:
    image: postgres:18.1-bookworm
    container_name: activity-tracking-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: always
    

  activity-tracking-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
      
  activity-tracking-port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: activity-tracking-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:activity-tracking-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    
  activity-tracking-ngrok:
    image: ngrok/ngrok:3
    container_name: activity-tracking-env-ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --url=${NGROK_DOMAIN} host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
volumes:
  pgdata:
